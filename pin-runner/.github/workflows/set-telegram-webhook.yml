# Point the Telegram bot at the Pages Function /tg (with the secret header token).
name: set-telegram-webhook
on:
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: set-telegram-webhook
  cancel-in-progress: false

jobs:
  webhook:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set webhook and show info
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}
        run: |
          set +x
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_WEBHOOK_SECRET" ] || [ -z "$SITE_BASE_URL" ]; then
            echo "TELEGRAM_BOT_TOKEN, TELEGRAM_WEBHOOK_SECRET and SITE_BASE_URL must be set"; exit 1
          fi
          RESP=$(curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setWebhook" \
            --data-urlencode "url=${SITE_BASE_URL}/tg" \
            --data-urlencode "secret_token=${TELEGRAM_WEBHOOK_SECRET}" \
            --data-urlencode 'allowed_updates=["message","callback_query"]')
          echo "$RESP" | sed "s#${TELEGRAM_BOT_TOKEN}#***#g"
          echo "$RESP" | jq -e '.ok == true' > /dev/null || { echo "setWebhook failed"; exit 1; }
          curl -sS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getWebhookInfo" | sed "s#${TELEGRAM_BOT_TOKEN}#***#g" | jq .
