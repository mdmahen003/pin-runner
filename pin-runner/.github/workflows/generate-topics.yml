# Generate topic hub pages (LLM) into D1.
name: generate-topics
on:
  workflow_dispatch:
    inputs:
      count:
        description: 'How many topics'
        type: string
        default: '10'
permissions:
  contents: read

concurrency:
  group: generate-topics
  cancel-in-progress: false

jobs:
  topics:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check out pin-core
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.CORE_REPO }}
          token: ${{ secrets.CORE_PAT }}
          path: core
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: core
        run: npm install --no-audit --no-fund
      - name: Generate topics
        working-directory: core
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          CF_TEXT_MODEL: ${{ vars.CF_TEXT_MODEL }}
          LLM_PROVIDER_ORDER: ${{ vars.LLM_PROVIDER_ORDER }}
          LLM_MIN_GAP_MS: ${{ vars.LLM_MIN_GAP_MS }}
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}
          COUNT: ${{ inputs.count || '10' }}
        run: |
          case "$COUNT" in ''|*[!0-9]*) echo "count must be a number"; exit 1;; esac
          node src/jobs/generate-topics.js --count "$COUNT"
      - name: Upload job output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generate-topics-output
          path: core/out/**
          retention-days: 7
          if-no-files-found: ignore
