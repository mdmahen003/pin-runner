# Copy the runner repo's secrets into the Cloudflare Pages project (Functions read them at runtime).
name: set-pages-secrets
on:
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: set-pages-secrets
  cancel-in-progress: false

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check out pin-core
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.CORE_REPO }}
          token: ${{ secrets.CORE_PAT }}
          path: core
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: core
        run: npm install --no-audit --no-fund
      - name: Put Pages secrets
        working-directory: core
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT || 'pin-factory-site' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CHECKOUT_PROVIDER: ${{ secrets.CHECKOUT_PROVIDER }}
          CHECKOUT_WEBHOOK_SECRET: ${{ secrets.CHECKOUT_WEBHOOK_SECRET }}
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}
          R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
        run: |
          for NAME in TELEGRAM_BOT_TOKEN TELEGRAM_WEBHOOK_SECRET TELEGRAM_CHAT_ID CHECKOUT_PROVIDER CHECKOUT_WEBHOOK_SECRET SITE_BASE_URL R2_PUBLIC_BASE; do
            VALUE="${!NAME}"
            if [ -z "$VALUE" ]; then
              echo "::warning::$NAME is empty in GitHub secrets - skipped"
              continue
            fi
            printf '%s' "$VALUE" | npx wrangler pages secret put "$NAME" --project-name "$CF_PAGES_PROJECT" > /dev/null
            echo "set $NAME"
          done
