# Daily pin factory: ideate -> render -> QA -> save drafts -> Telegram contact sheet.
name: daily-factory
on:
  schedule:
    # 21:00 in UTC+6 (Dhaka) = 15:00 UTC.  To run at H:MM Dhaka time, subtract 6 hours and edit the cron below
    # (format: minute hour * * *, hour is in UTC).  Example: 08:30 Dhaka = 02:30 UTC = '30 2 * * *'.
    - cron: '0 15 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (local sandbox only, nothing published)'
        type: boolean
        default: true
      count:
        description: 'Number of pins to generate'
        type: string
        default: '20'
      force:
        description: 'Run even if this batch date already exists'
        type: boolean
        default: false
permissions:
  contents: read

concurrency:
  group: daily-factory
  cancel-in-progress: false

jobs:
  factory:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Check out pin-core
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.CORE_REPO }}
          token: ${{ secrets.CORE_PAT }}
          path: core
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: core
        run: npm install --no-audit --no-fund
      - name: Install Chromium and exiftool
        working-directory: core
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y libimage-exiftool-perl
      - name: Run daily factory
        working-directory: core
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          CF_TEXT_MODEL: ${{ vars.CF_TEXT_MODEL }}
          LLM_PROVIDER_ORDER: ${{ vars.LLM_PROVIDER_ORDER }}
          LLM_MIN_GAP_MS: ${{ vars.LLM_MIN_GAP_MS }}
          IMAGE_WORKER_URL: ${{ secrets.IMAGE_WORKER_URL }}
          IMAGE_WORKER_SECRET: ${{ secrets.IMAGE_WORKER_SECRET }}
          IMAGE_NEURON_BUDGET_DAILY: ${{ vars.IMAGE_NEURON_BUDGET_DAILY }}
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          COUNT: ${{ inputs.count || '20' }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force || 'false' }}
        run: |
          case "$COUNT" in ''|*[!0-9]*) echo "count must be a number"; exit 1;; esac
          FLAGS=""
          if [ "$DRY_RUN" = "true" ]; then FLAGS="$FLAGS --dry-run"; fi
          if [ "$FORCE" = "true" ]; then FLAGS="$FLAGS --force"; fi
          node src/jobs/daily.js --count "$COUNT" $FLAGS
      - name: Upload job output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-factory-output
          path: core/out/**
          retention-days: 7
          if-no-files-found: ignore
