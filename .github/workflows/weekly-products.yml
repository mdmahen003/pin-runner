# Build planner PDFs + previews (and optionally publish them to R2/D1).
name: weekly-products
on:
  workflow_dispatch:
    inputs:
      product:
        description: 'Product id (empty = all products), e.g. student-gpa-v1'
        type: string
        default: ''
      version:
        description: 'Version number (empty = version from products.json)'
        type: string
        default: ''
      publish:
        description: 'Upload to R2 and write to D1'
        type: boolean
        default: false
permissions:
  contents: read

concurrency:
  group: weekly-products
  cancel-in-progress: false

jobs:
  products:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Check out pin-core
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.CORE_REPO }}
          token: ${{ secrets.CORE_PAT }}
          path: core
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: core
        run: npm install --no-audit --no-fund
      - name: Install Chromium and exiftool
        working-directory: core
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y libimage-exiftool-perl
      - name: Build products
        working-directory: core
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}
          PRODUCT: ${{ inputs.product }}
          VERSION: ${{ inputs.version }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          ARGS=""
          if [ -n "$PRODUCT" ]; then
            case "$PRODUCT" in *[!a-z0-9-]*) echo "invalid product id"; exit 1;; esac
            ARGS="$ARGS --product $PRODUCT"
          fi
          if [ -n "$VERSION" ]; then
            case "$VERSION" in *[!0-9]*) echo "version must be a number"; exit 1;; esac
            ARGS="$ARGS --version $VERSION"
          fi
          if [ "$PUBLISH" = "true" ]; then ARGS="$ARGS --publish"; fi
          node src/jobs/weekly-products.js $ARGS
      - name: Upload job output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-products-output
          path: core/out/**
          retention-days: 7
          if-no-files-found: ignore
