# Every ~3 hours: auto-approve (if enabled), schedule approved pins into the feeds, mark old pins as posted.
name: schedule-feed
on:
  schedule:
    - cron: '20 */3 * * *'
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: schedule-feed
  cancel-in-progress: false

jobs:
  schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check out pin-core
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.CORE_REPO }}
          token: ${{ secrets.CORE_PAT }}
          path: core
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: core
        run: npm install --no-audit --no-fund
      - name: Schedule feed
        working-directory: core
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}
        run: |
          node src/jobs/schedule-feed.js
      - name: Upload job output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schedule-feed-output
          path: core/out/**
          retention-days: 7
          if-no-files-found: ignore
