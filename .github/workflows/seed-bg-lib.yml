# Fill the AI background library in R2 (fallback when the daily neuron budget runs out).
name: seed-bg-lib
on:
  workflow_dispatch:
    inputs:
      per_category:
        description: 'Images per library category'
        type: string
        default: '25'
permissions:
  contents: read

concurrency:
  group: seed-bg-lib
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Check out pin-core
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.CORE_REPO }}
          token: ${{ secrets.CORE_PAT }}
          path: core
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: core
        run: npm install --no-audit --no-fund
      - name: Seed background library
        working-directory: core
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IMAGE_WORKER_URL: ${{ secrets.IMAGE_WORKER_URL }}
          IMAGE_WORKER_SECRET: ${{ secrets.IMAGE_WORKER_SECRET }}
          IMAGE_NEURON_BUDGET_DAILY: ${{ vars.IMAGE_NEURON_BUDGET_DAILY }}
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}
          PER_CATEGORY: ${{ inputs.per_category || '25' }}
        run: |
          case "$PER_CATEGORY" in ''|*[!0-9]*) echo "per_category must be a number"; exit 1;; esac
          node src/jobs/seed-bg-lib.js --per-category "$PER_CATEGORY"
      - name: Upload job output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seed-bg-lib-output
          path: core/out/**
          retention-days: 7
          if-no-files-found: ignore
