# Plan-B export: Pinterest bulk-upload CSV for one ISO week (-> R2 + Telegram document).
name: export-csv
on:
  workflow_dispatch:
    inputs:
      week:
        description: 'ISO week, e.g. 2026-W41 (empty = current week)'
        type: string
        default: ''
permissions:
  contents: read

concurrency:
  group: export-csv
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check out pin-core
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.CORE_REPO }}
          token: ${{ secrets.CORE_PAT }}
          path: core
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: core
        run: npm install --no-audit --no-fund
      - name: Export CSV
        working-directory: core
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}
          WEEK: ${{ inputs.week }}
        run: |
          if [ -n "$WEEK" ]; then
            echo "$WEEK" | grep -Eq '^[0-9]{4}-W[0-9]{2}$' || { echo "week must look like 2026-W41"; exit 1; }
            node src/jobs/export-csv.js --week "$WEEK"
          else
            node src/jobs/export-csv.js
          fi
      - name: Upload job output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: export-csv-output
          path: core/out/**
          retention-days: 7
          if-no-files-found: ignore
