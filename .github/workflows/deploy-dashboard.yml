# Deploy the owner dashboard (pin-core/dashboard) to its own Cloudflare Pages project and (re)set its runtime secrets.
# Order matters: create project -> put secrets -> deploy (Pages applies secrets at deploy time).
name: deploy-dashboard
on:
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: deploy-dashboard
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check out pin-core
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.CORE_REPO }}
          token: ${{ secrets.CORE_PAT }}
          path: core
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check dashboard source and login secrets
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          DASHBOARD_SECRET: ${{ secrets.DASHBOARD_SECRET }}
        run: |
          test -f core/dashboard/wrangler.toml || { echo "::error::core/dashboard not found - unzip pin-core-dashboard.zip into the pin-core repo root first"; exit 1; }
          [ "${#DASHBOARD_PASSWORD}" -ge 10 ] || { echo "::error::Secret DASHBOARD_PASSWORD is missing or shorter than 10 characters"; exit 1; }
          [ "${#DASHBOARD_SECRET}" -ge 32 ] || { echo "::error::Secret DASHBOARD_SECRET is missing or shorter than 32 characters"; exit 1; }
      - name: Dashboard tests
        working-directory: core/dashboard
        run: node --test tests/*.test.js
      - name: Install wrangler
        run: npm install --prefix "$RUNNER_TEMP/w" wrangler@3.114.17 --no-audit --no-fund
      - name: Insert D1 database id into wrangler.toml
        working-directory: core/dashboard
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          case "$D1_DATABASE_ID" in ''|*[!0-9a-fA-F-]*) echo "::error::D1_DATABASE_ID secret is missing or malformed"; exit 1;; esac
          sed -i "s/REPLACE_D1_DATABASE_ID/${D1_DATABASE_ID}/" wrangler.toml
      - name: Create Pages project if needed
        working-directory: core/dashboard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          DASH_PROJECT: ${{ vars.CF_DASHBOARD_PROJECT || 'pin-dashboard' }}
        run: |
          WR="$RUNNER_TEMP/w/node_modules/.bin/wrangler"
          if "$WR" pages project list 2>/dev/null | grep -q "[[:space:]]${DASH_PROJECT}[[:space:]]"; then
            echo "Pages project $DASH_PROJECT already exists"
          else
            "$WR" pages project create "$DASH_PROJECT" --production-branch main || echo "::warning::project create returned an error (it may already exist) - continuing"
          fi
      - name: Put dashboard secrets
        working-directory: core/dashboard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          DASH_PROJECT: ${{ vars.CF_DASHBOARD_PROJECT || 'pin-dashboard' }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          DASHBOARD_SECRET: ${{ secrets.DASHBOARD_SECRET }}
          GITHUB_TOKEN: ${{ secrets.DASHBOARD_GITHUB_TOKEN }}
          GITHUB_CORE_REPO: ${{ vars.CORE_REPO }}
          GITHUB_RUNNER_REPO: ${{ github.repository }}
          GITHUB_BRANCH: main
          R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}
        run: |
          WR="$RUNNER_TEMP/w/node_modules/.bin/wrangler"
          for NAME in DASHBOARD_PASSWORD DASHBOARD_SECRET GITHUB_TOKEN GITHUB_CORE_REPO GITHUB_RUNNER_REPO GITHUB_BRANCH R2_PUBLIC_BASE SITE_BASE_URL; do
            VALUE="${!NAME}"
            if [ -z "$VALUE" ]; then
              echo "::warning::$NAME is empty - skipped (the dashboard shows what is missing under Settings)"
              continue
            fi
            printf '%s' "$VALUE" | "$WR" pages secret put "$NAME" --project-name "$DASH_PROJECT" > /dev/null
            echo "set $NAME"
          done
      - name: Deploy to Cloudflare Pages
        working-directory: core/dashboard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          DASH_PROJECT: ${{ vars.CF_DASHBOARD_PROJECT || 'pin-dashboard' }}
        run: |
          WR="$RUNNER_TEMP/w/node_modules/.bin/wrangler"
          # VERIFY: --branch must equal the production branch ("main", set when the project is created above).
          "$WR" pages deploy public --project-name "$DASH_PROJECT" --branch main --commit-dirty=true | tee "$RUNNER_TEMP/deploy.log"
          URL=$(grep -Eo 'https://[a-zA-Z0-9.-]+\.pages\.dev' "$RUNNER_TEMP/deploy.log" | tail -1)
          echo "Dashboard: ${URL:-https://${DASH_PROJECT}.pages.dev}" | tee -a "$GITHUB_STEP_SUMMARY"
