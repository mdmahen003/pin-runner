# CI: syntax check + unit tests. No secrets are needed except CORE_PAT to read the private pin-core repo.
name: ci
on:
  workflow_dispatch:
  schedule:
    - cron: '45 3 * * 1'   # weekly, Monday 03:45 UTC
permissions:
  contents: read

concurrency:
  group: ci
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check out pin-core
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.CORE_REPO }}
          token: ${{ secrets.CORE_PAT }}
          path: core
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: core
        run: npm install --no-audit --no-fund
      - name: Syntax check and unit tests
        working-directory: core
        run: |
          npm run check
          npm test
      - name: Site tests
        working-directory: core
        run: |
          if [ -f site/package.json ]; then
            cd site
            npm install --no-audit --no-fund
            npm test
          else
            echo "site/ not present - skipped"
          fi
      - name: Upload job output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-output
          path: core/out/**
          retention-days: 7
          if-no-files-found: ignore
