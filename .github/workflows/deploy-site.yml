# Build the static site and deploy it (with Pages Functions) to Cloudflare Pages.
name: deploy-site
on:
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check out pin-core
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.CORE_REPO }}
          token: ${{ secrets.CORE_PAT }}
          path: core
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: core
        run: npm install --no-audit --no-fund
      - name: Sync products to D1
        working-directory: core
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}
        run: |
          node src/jobs/sync-products.js
      - name: Build site
        working-directory: core
        env:
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}
          R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
        run: |
          cd site
          npm install --no-audit --no-fund
          npm run sync
          npm run build
      - name: Insert D1 database id into wrangler.toml
        working-directory: core
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          case "$D1_DATABASE_ID" in ''|*[!0-9a-fA-F-]*) echo "D1_DATABASE_ID secret is missing or malformed"; exit 1;; esac
          sed -i "s/REPLACE_D1_DATABASE_ID/${D1_DATABASE_ID}/" site/wrangler.toml
      - name: Deploy to Cloudflare Pages
        working-directory: core
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT || 'pin-factory-site' }}
        run: |
          # VERIFY: --branch must match the Pages production branch (default "main") so this becomes the production deployment.
          npx wrangler pages deploy site/out --project-name "$CF_PAGES_PROJECT" --branch main --commit-dirty=true
      - name: Upload job output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-site-output
          path: core/out/**
          retention-days: 7
          if-no-files-found: ignore
